name: Build Mouse APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Create Flutter Android project
        run: |
          rm -rf /tmp/flutter_project
          flutter create \
            --platforms android \
            --org com.mouse \
            --project-name mouse_app \
            /tmp/flutter_project

      - name: Copy project files
        run: |
          cp pubspec.yaml /tmp/flutter_project/pubspec.yaml

          rm -rf /tmp/flutter_project/lib
          cp -r lib /tmp/flutter_project/lib

          rsync -a --delete android/app/src/main/ /tmp/flutter_project/android/app/src/main/
          cp android/app/build.gradle /tmp/flutter_project/android/app/build.gradle
          cp android/build.gradle /tmp/flutter_project/android/build.gradle
          cp android/settings.gradle /tmp/flutter_project/android/settings.gradle
          cp android/gradle.properties /tmp/flutter_project/android/gradle.properties

      - name: Get dependencies
        working-directory: /tmp/flutter_project
        run: flutter pub get

      - name: Build APK
        working-directory: /tmp/flutter_project
        run: flutter build apk --release -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mouse-app-release
          path: /tmp/flutter_project/build/app/outputs/flutter-apk/app-release.apk
